<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Horario académico</title>
</head>
<body>
	<h1>Horario académico</h1>

	<table border="1">
		<thead>
			<tr>
				<th colspan="3">Horario semanal</th>
			</tr>
			<tr>
				<th>Día</th>
				<th>Materia</th>
				<th>Horario</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td rowspan="2">Lunes</td>
				<td>Matemáticas</td>
				<td>08:00 - 10:00</td>
			</tr>
			<tr>
				<td>Historia</td>
				<td>10:00 - 12:00</td>
			</tr>
			<tr>
				<td>Martes</td>
				<td>Lengua</td>
				<td>08:00 - 10:00</td>
			</tr>
			<tr>
				<td>Miércoles</td>
				<td>Ciencias</td>
				<td>09:00 - 11:00</td>
			</tr>
		</tbody>
		<tfoot>
			<tr>
				<td colspan="2"><strong>Total de materias</strong></td>
				<td><strong>4</strong></td>
			</tr>
		</tfoot>
	</table>
</body>
</html>
