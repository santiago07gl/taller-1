<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mi galería personal</title>
</head>
<body>
	<header>
		<h1>Mi galería personal</h1>
		<p>Una selección de lugares y momentos que me inspiran.</p>
	</header>

	<main>
		<section>
			<figure>
				<img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Montañas junto a un lago" width="800">
				<figcaption>La tranquilidad de las montañas reflejada en el agua.</figcaption>
			</figure>
			<a href="https://www.nationalgeographic.com/travel/" target="_blank" rel="noopener noreferrer">Explorar destinos en National Geographic</a>
		</section>

		<section>
			<figure>
				<img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=800&q=80" alt="Planta verde iluminada por el sol" width="800">
				<figcaption>La naturaleza aporta color y vida a cada espacio.</figcaption>
			</figure>
			<a href="https://www.bbcearth.com/" target="_blank" rel="noopener noreferrer">Conocer más sobre la naturaleza</a>
		</section>

		<section>
			<figure>
				<img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=800&q=80" alt="Bosque con árboles altos" width="800">
				<figcaption>Un paseo por el bosque para desconectar y respirar.</figcaption>
			</figure>
			<a href="https://www.wwf.org/" target="_blank" rel="noopener noreferrer">Apoyar la conservación del planeta</a>
		</section>
	</main>
</body>
</html>
