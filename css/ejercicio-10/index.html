<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Estados y selectores CSS</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Mi página interactiva</h1>
		<nav>
			<a href="#inicio">Inicio</a>
			<a href="#servicios">Servicios</a>
			<a href="#contacto">Contacto</a>
		</nav>
	</header>

	<main>
		<section class="formulario" id="contacto">
			<h2>Contáctanos</h2>
			<form>
				<label for="nombre">Nombre</label>
				<input type="text" id="nombre" placeholder="Escribe tu nombre">

				<label for="correo">Correo electrónico</label>
				<input type="email" id="correo" placeholder="Escribe tu correo">

				<button type="submit">Enviar</button>
			</form>
		</section>

		<section class="lista" id="servicios">
			<h2>Actividades</h2>
			<ul>
				<li>Leer un libro</li>
				<li>Aprender CSS</li>
				<li>Practicar Flexbox</li>
				<li>Crear una página web</li>
			</ul>
		</section>
	</main>
</body>
</html>
