<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pagina responsive</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="contenedor">
		<header class="encabezado">
			<h1>Mi página responsive</h1>
			<p>Esta página se adapta al tamaño de la pantalla.</p>
		</header>

		<section class="contenido">
			<h2>Área de contenido</h2>
			<p>En una pantalla grande, el contenido tiene un ancho definido. En un dispositivo móvil, ocupa todo el ancho disponible para facilitar la lectura.</p>
		</section>
	</main>
</body>
</html>
